            /* ─ PageAnalitik ──────────────────────────────────────────────────────────────── */
            function PageAnalitik() {
                const [monthly, setMonthly] = useState([]);
                const [heatmap, setHeatmap] = useState([]);
                const [summary, setSummary] = useState(null);
                const [loading, setLoading] = useState(true);

                useEffect(() => {
                    let alive = true;
                    Promise.all([
                        fetch("/api/analytics/monthly").then(r => r.json()),
                        fetch("/api/analytics/heatmap").then(r => r.json()),
                        fetch("/api/analytics/summary").then(r => r.json()),
                    ]).then(([m, h, s]) => {
                        if (!alive) return;
                        if (m.data) setMonthly(m.data);
                        if (h.data) setHeatmap(h.data);
                        if (s.data) setSummary(s.data);
                        setLoading(false);
                    }).catch(e => { console.error(e); setLoading(false); });
                    return () => { alive = false; };
                }, []);

                // SVG Line Chart for monthly trend
                const MonthlyChart = () => {
                    if (monthly.length === 0) return (
                        <div style={{ padding: 40, textAlign: "center", color: "var(--text-3)", fontSize: 12 }}>No monthly data yet</div>
                    );
                    const W = 580, H = 160, PAD = { top: 16, right: 16, bottom: 32, left: 40 };
                    const maxTotal = Math.max(...monthly.map(m => m.total), 1);
                    const pts = monthly.map((m, i) => ({
                        x: PAD.left + (i / Math.max(monthly.length - 1, 1)) * (W - PAD.left - PAD.right),
                        y: PAD.top + (1 - m.total / maxTotal) * (H - PAD.top - PAD.bottom),
                        ...m,
                    }));
                    const polyline = pts.map(p => `${p.x},${p.y}`).join(" ");
                    const areaPath = pts.length > 0
                        ? `M${pts[0].x},${H - PAD.bottom} ` + pts.map(p => `L${p.x},${p.y}`).join(" ") + ` L${pts[pts.length-1].x},${H - PAD.bottom} Z`
                        : "";
                    const yTicks = [0, Math.round(maxTotal/2), maxTotal];
                    return (
                        <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ overflow: "visible" }}>
                            {/* Grid lines */}
                            {yTicks.map((v, i) => {
                                const y = PAD.top + (1 - v / maxTotal) * (H - PAD.top - PAD.bottom);
                                return (
                                    <g key={i}>
                                        <line x1={PAD.left} y1={y} x2={W - PAD.right} y2={y} stroke="var(--border)" strokeWidth="0.5"/>
                                        <text x={PAD.left - 6} y={y + 3} fontSize="8" fill="var(--text-3)" textAnchor="end">{v}</text>
                                    </g>
                                );
                            })}
                            {/* Area fill */}
                            {areaPath && <path d={areaPath} fill="rgba(248,81,73,0.06)"/>}
                            {/* Major (M>=5) bars */}
                            {pts.map((p, i) => {
                                const barH = (p.major / maxTotal) * (H - PAD.top - PAD.bottom);
                                return <rect key={i} x={p.x - 4} y={H - PAD.bottom - barH} width={8} height={barH} fill="rgba(248,81,73,0.3)" rx="1"/>;
                            })}
                            {/* Line */}
                            <polyline points={polyline} fill="none" stroke="var(--red)" strokeWidth="1.5" strokeLinejoin="round"/>
                            {/* Dots */}
                            {pts.map((p, i) => (
                                <circle key={i} cx={p.x} cy={p.y} r="3" fill="var(--red)">
                                    <title>{p.month}: {p.total} gempa (M≥5: {p.major})</title>
                                </circle>
                            ))}
                            {/* X labels */}
                            {pts.map((p, i) => (
                                <text key={i} x={p.x} y={H - PAD.bottom + 12} fontSize="7.5" fill="var(--text-3)" textAnchor="middle">
                                    {p.month ? p.month.substring(5) : ""}
                                </text>
                            ))}
                        </svg>
                    );
                };

                // Heatmap Leaflet Map
                const HeatmapViz = () => {
                    const mapRef = useRef(null);
                    const [mapInstance, setMapInstance] = useState(null);

                    useEffect(() => {
                        if (!mapRef.current || typeof L === "undefined") return;
                        try {
                            const map = L.map(mapRef.current, {
                                zoomControl: true,
                                attributionControl: false,
                            }).setView([-2.5, 118.0], 5);
                            L.tileLayer(TILE_URL, TILE_OPTS).addTo(map);
                            setMapInstance(map);
                            
                            return () => {
                                map.remove();
                            };
                        } catch (e) {
                            print("Heatmap map init error:", e);
                        }
                    }, []);

                    useEffect(() => {
                        if (!mapInstance || heatmap.length === 0) return;
                        
                        const layers = [];
                        const maxCount = Math.max(...heatmap.map(d => d.count), 1);
                        
                        heatmap.forEach(d => {
                            const intensity = d.count / maxCount;
                            const r255 = Math.round(248 * intensity);
                            
                            const radius = Math.max(50000, Math.min(250000, (d.count / maxCount) * 200000 + 50000));
                            
                            const circle = L.circle([d.lat_grid, d.lon_grid], {
                                radius: radius,
                                fillColor: `rgb(${r255}, ${Math.round(81*(1-intensity)+34*intensity)}, ${Math.round(73*(1-intensity))})`,
                                fillOpacity: 0.55,
                                color: `rgb(${r255}, ${Math.round(81*(1-intensity))}, 73)`,
                                weight: 1
                            }).addTo(mapInstance);
                            
                            circle.bindPopup(`
                                <strong>Grid Area:</strong> ${d.lat_grid.toFixed(1)}°, ${d.lon_grid.toFixed(1)}°<br/>
                                <strong>Earthquakes:</strong> ${d.count}<br/>
                                <strong>Max Magnitude:</strong> M${Number(d.max_mag).toFixed(1)}
                            `);
                            layers.push(circle);
                        });
                        
                        return () => {
                            layers.forEach(l => l.remove());
                        };
                    }, [mapInstance, heatmap]);

                    return (
                        <div ref={mapRef} style={{ height: 260, borderRadius: 4, background: "var(--bg)", border: "1px solid var(--border)" }} />
                    );
                };

                const StatCard = ({ label, value, sub, color }) => (
                    <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 6, padding: "12px 14px", flex: "1 1 140px" }}>
                        <div style={{ fontSize: 10, color: "var(--text-3)", marginBottom: 4, textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</div>
                        <div style={{ fontSize: 22, fontWeight: 700, fontFamily: "var(--mono)", color: color || "var(--text-1)" }}>{value}</div>
                        {sub && <div style={{ fontSize: 10, color: "var(--text-3)", marginTop: 2 }}>{sub}</div>}
                    </div>
                );

                return (
                    <div style={{ maxWidth: 860, margin: "0 auto" }}>
                        <div style={{ marginBottom: 16 }}>
                            <div style={{ fontSize: 14, fontWeight: 600, color: "var(--text-1)" }}>Earthquake Analytics</div>
                            <div style={{ fontSize: 11, color: "var(--text-3)", marginTop: 2 }}>CEPAT historical earthquake statistics and visualizations</div>
                        </div>

                        {loading ? (
                            <div style={{ padding: 60, textAlign: "center", color: "var(--text-3)", fontSize: 12 }}>Loading analytics data...</div>
                        ) : (
                            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                                {/* Summary KPI cards */}
                                {summary && (
                                    <div className="analytics-kpi-grid">
                                        <StatCard label="Total Earthquakes" value={summary.total_earthquakes} sub="Full database"/>
                                        <StatCard label="M≥5 Earthquakes" value={summary.major_earthquakes} color="var(--red)" sub={`${Math.round(summary.major_earthquakes/Math.max(summary.total_earthquakes,1)*100)}% of total`}/>
                                        <StatCard label="Avg Magnitude" value={summary.avg_magnitude ? summary.avg_magnitude.toFixed(2) : "—"} color="var(--orange)" sub="All earthquakes"/>
                                        <StatCard label="Highest" value={summary.max_magnitude ? `M${summary.max_magnitude.toFixed(1)}` : "—"} color="var(--red)" sub="Maximum magnitude"/>
                                        <StatCard label="Pipeline Done" value={`${summary.pipeline_ratio}%`} color="var(--green)" sub={`${summary.pipeline_done} earthquakes processed`}/>
                                        <StatCard label="Approved Drafts" value={`${summary.approval_ratio}%`} color="var(--blue)" sub={`${summary.approved_drafts}/${summary.total_drafts} drafts`}/>
                                    </div>
                                )}

                                {/* Monthly trend chart */}
                                <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 6, padding: "14px 16px" }}>
                                    <div style={{ fontSize: 12, fontWeight: 600, color: "var(--text-1)", marginBottom: 12 }}>
                                        Earthquake Trend (Last 12 Months)
                                        <span style={{ fontSize: 10, fontWeight: 400, color: "var(--text-3)", marginLeft: 8 }}>Total (garis merah) · M≥5 (batang merah)</span>
                                    </div>
                                    <MonthlyChart/>
                                </div>

                                {/* Heatmap */}
                                <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 6, padding: "14px 16px" }}>
                                    <div style={{ fontSize: 12, fontWeight: 600, color: "var(--text-1)", marginBottom: 6 }}>
                                        Geographical Earthquake Distribution
                                        <span style={{ fontSize: 10, fontWeight: 400, color: "var(--text-3)", marginLeft: 8 }}>Circle size = frequency · Color = intensity (red = high)</span>
                                    </div>
                                    <div style={{ marginBottom: 8, fontSize: 10, color: "var(--text-3)" }}>
                                        {heatmap.length} active zones · Top 5:{" "}
                                        {heatmap.slice(0, 5).map(d => `${d.lat_grid}°,${d.lon_grid}° (${d.count})`).join(" · ")}
                                    </div>
                                    <HeatmapViz/>
                                </div>

                                {/* Monthly table */}
                                {monthly.length > 0 && (
                                    <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 6, overflow: "hidden" }}>
                                        <div style={{ padding: "10px 14px 8px", fontSize: 12, fontWeight: 600, color: "var(--text-1)", borderBottom: "1px solid var(--border)" }}>Monthly Data</div>
                                        <div style={{ overflowX: "auto" }}>
                                            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}>
                                                <thead>
                                                    <tr style={{ background: "var(--surface-2)" }}>
                                                        {["Month","Total","M≥5","Avg Mag","Highest"].map(h => (
                                                            <th key={h} style={{ padding: "6px 12px", textAlign: h === "Bulan" ? "left" : "right", fontSize: 10, fontWeight: 600, color: "var(--text-3)", borderBottom: "1px solid var(--border)" }}>{h}</th>
                                                        ))}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {[...monthly].reverse().map((m, i) => (
                                                        <tr key={i} style={{ borderBottom: "1px solid var(--border)" }}>
                                                            <td style={{ padding: "6px 12px", fontFamily: "var(--mono)", color: "var(--text-1)" }}>{m.month}</td>
                                                            <td style={{ padding: "6px 12px", textAlign: "right", fontFamily: "var(--mono)", fontWeight: 600, color: "var(--text-1)" }}>{m.total}</td>
                                                            <td style={{ padding: "6px 12px", textAlign: "right", fontFamily: "var(--mono)", color: m.major > 0 ? "var(--red)" : "var(--text-3)" }}>{m.major}</td>
                                                            <td style={{ padding: "6px 12px", textAlign: "right", fontFamily: "var(--mono)", color: "var(--text-2)" }}>{m.avg_mag ? Number(m.avg_mag).toFixed(2) : "—"}</td>
                                                            <td style={{ padding: "6px 12px", textAlign: "right", fontFamily: "var(--mono)", color: m.max_mag >= 5 ? "var(--orange)" : "var(--text-2)" }}>{m.max_mag ? `M${Number(m.max_mag).toFixed(1)}` : "—"}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            }

            /* ─ App ────────────────────────────────────────────────────────────────────────── */
            function App() {
                const [tweaks, setTweak] = useTweaks({
                    ...TWEAK_DEFAULTS,
                    uiTheme: getInitialTheme(),
                });
                const [nav, setNav] = useState("Monitor");
                const isLight = tweaks.uiTheme === "light";
                const toggleTheme = () =>
                    setTweak("uiTheme", isLight ? "dark" : "light");
                const [latestEq, setLatestEq] = useState(null);
                const [stats, setStats] = useState(null);
                const [pendingDrafts, setPendingDrafts] = useState([]);
                const [logs, setLogs] = useState([]);
                const [agentFeed, setAgentFeed] = useState([
                    {
                        st: "proc",
                        ag: "Sistem",
                        d: "Menyiapkan data aktivitas agen...",
                        ts: "—",
                    },
                ]);
                // State modal edit
                const [editModal, setEditModal] = useState(null); // null | {id, content}
                const [toast, setToast] = useState(null);
                const [notifOpen, setNotifOpen] = useState(false);
                const [operator, setOperator] = useState("");
                const [approvalStats, setApprovalStats] = useState({
                    pending_drafts: 0,
                    pending_plans: 0,
                });

                const showToast = (msg) => {
                    setToast(msg);
                    setTimeout(() => setToast(null), 2500);
                };

                const fetchData = async () => {
                    try {
                        const statsRes = await fetch("/api/stats");
                        const eqRes = await fetch(
                            "/api/earthquakes?limit=1",
                        );
                        const draftsRes = await fetch(
                            "/api/approval/drafts/pending",
                        );
                        const feedRes = await fetch("/api/feed");

                        if (statsRes.ok) {
                            const json = await statsRes.json();
                            setStats(json.data);
                        }
                        if (eqRes.ok) {
                            const json = await eqRes.json();
                            const eq =
                                json && json.data && json.data[0]
                                    ? json.data[0]
                                    : null;
                            setLatestEq(eq);
                        }
                        if (draftsRes.ok) {
                            const json = await draftsRes.json();
                            setPendingDrafts(json.data || []);
                        }
                        if (feedRes.ok) {
                            const json = await feedRes.json();
                            if (json.data && json.data.length > 0) {
                                // Format timestamps for display
                                const formattedFeed = json.data.map(
                                    (item) => {
                                        const date = new Date(item.ts);
                                        const timeString = isNaN(
                                            date.getTime(),
                                        )
                                            ? item.ts.substring(11, 19)
                                            : date.toLocaleTimeString(
                                                  "id-ID",
                                                  { hour12: false },
                                              );
                                        return { ...item, ts: timeString };
                                    },
                                );
                                setAgentFeed(formattedFeed);
                            }
                        }
                        try {
                            const approvalRes = await fetch(
                                "/api/approval/stats",
                            );
                            if (approvalRes.ok) {
                                const j = await approvalRes.json();
                                setApprovalStats(j.data || {});
                            }
                        } catch (e) {
                            /* silently fail */
                        }
                    } catch (e) {
                        console.error("Fetch error:", e);
                    }
                };

                useEffect(() => {
                    let alive = true;
                    fetchData();
                    // Fetch operator name once on mount
                    fetch("/api/me")
                        .then((r) => (r.ok ? r.json() : null))
                        .then((j) => {
                            if (j && alive) setOperator(j.operator || "");
                        })
                        .catch(() => {});
                    const t = setInterval(() => {
                        if (alive) fetchData();
                    }, 10000);
                    return () => {
                        alive = false;
                        clearInterval(t);
                    };
                }, []);

                useEffect(() => {
                    const socket = io();

                    socket.on("connect", () => {
                        console.log("[WebSocket] Terhubung!");
                    });

                    socket.on("new_earthquake", (data) => {
                        console.log("[WebSocket] Gempa baru:", data);
                        showToast(`🚨 NEW EARTHQUAKE: M${Number(data.magnitude).toFixed(1)} - ${data.location_desc}`);
                        // Play alert sound
                        try {
                            const audio = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-500.wav");
                            audio.volume = 0.4;
                            audio.play().catch(() => {});
                        } catch(e) {}
                        fetchData();
                    });

                    socket.on("draft_pending", (data) => {
                        console.log("[WebSocket] Draf pending:", data);
                        showToast(`✉️ New draft ready for approval (Earthquake ID #${data.earthquake_id})`);
                        fetchData();
                    });

                    socket.on("pipeline_done", (data) => {
                        console.log("[WebSocket] Pipeline completed:", data);
                        showToast(`✓ Earthquake analysis M${Number(data.magnitude).toFixed(1)} completed`);
                        fetchData();
                    });

                    return () => {
                        socket.disconnect();
                    };
                }, []);

                useEffect(() => {
                    const root = document.documentElement;
                    const theme = isLight ? "light" : "dark";
                    root.dataset.theme = theme;
                    try {
                        localStorage.setItem(THEME_STORAGE_KEY, theme);
                    } catch (e) {}
                }, [isLight]);
                const [apprLocal, setApprLocal] = useState({});
                const [draftContents, setDraftContents] = useState({});

                const approveDraft = async (id) => {
                    try {
                        await fetch(`/api/approval/draft/${id}/approve`, {
                            method: "POST",
                        });
                        setApprLocal((p) => ({ ...p, [id]: "app" }));
                        fetchData();
                    } catch (e) {
                        console.error("Error approving", e);
                    }
                };
                const rejectDraft = async (id) => {
                    try {
                        await fetch(`/api/approval/draft/${id}/reject`, {
                            method: "POST",
                        });
                        setApprLocal((p) => ({ ...p, [id]: "rej" }));
                        fetchData();
                    } catch (e) {
                        console.error("Error rejecting", e);
                    }
                };

                const openEdit = (id) => {
                    const draft = pendingDrafts.find((d) => d.id === id);
                    if (draft)
                        setEditModal({
                            id,
                            content: draftContents[id] || draft.content,
                        });
                };
                const onEditSaved = (id, newContent) => {
                    setDraftContents((p) => ({ ...p, [id]: newContent }));
                    showToast("Draft successfully edited");
                    const now = new Date();
                    const ts = [
                        now.getHours(),
                        now.getMinutes(),
                        now.getSeconds(),
                    ]
                        .map((n) => String(n).padStart(2, "0"))
                        .join(":");
                    setLogs((p) => [
                        {
                            ts,
                            msg: (
                                <span>
                                    Draft #{id} <b>edited</b>
                                </span>
                            ),
                        },
                        ...p.slice(0, 4),
                    ]);
                };

                const act = (id, st) => {
                    if (st === "app") approveDraft(id);
                    if (st === "rej") rejectDraft(id);

                    const now = new Date();
                    const ts = [
                        now.getHours(),
                        now.getMinutes(),
                        now.getSeconds(),
                    ]
                        .map((n) => String(n).padStart(2, "0"))
                        .join(":");
                    setLogs((p) => [
                        {
                            ts,
                            msg: (
                                <span>
                                    Draft #{id}{" "}
                                    <b>
                                        {st === "app" ? "approved" : "rejected"}
                                    </b>
                                </span>
                            ),
                        },
                        ...p.slice(0, 4),
                    ]);
                };

                const mag =
                    latestEq && Number.isFinite(Number(latestEq.magnitude))
                        ? Number(latestEq.magnitude)
                        : null;
                const depth =
                    latestEq && Number.isFinite(Number(latestEq.depth_km))
                        ? Number(latestEq.depth_km)
                        : null;
                const lat =
                    latestEq && Number.isFinite(Number(latestEq.latitude))
                        ? Number(latestEq.latitude)
                        : null;
                const lon =
                    latestEq && Number.isFinite(Number(latestEq.longitude))
                        ? Number(latestEq.longitude)
                        : null;
                const loc =
                    latestEq && latestEq.location_desc
                        ? latestEq.location_desc
                        : "Lokasi tidak diketahui";
                const ts =
                    latestEq && latestEq.timestamp ? latestEq.timestamp : "—";

                const epicenter =
                    lat !== null && lon !== null && mag !== null
                        ? {
                              id: "ep",
                              lat,
                              lon,
                              label: `Episenter M${mag.toFixed(1)}`,
                              sub: loc,
                              type: "critical",
                          }
                        : DEFAULT_EPICENTER;

                useEffect(() => {
                    if (!notifOpen) return;
                    const handler = () => setNotifOpen(false);
                    document.addEventListener("click", handler);
                    return () => document.removeEventListener("click", handler);
                }, [notifOpen]);

                const newAlerts = stats?.new_alerts || 0;
                const pendingCount = approvalStats.pending_drafts || 0;
                const totalBadge = newAlerts + pendingCount;
                const antreanBadge = pendingDrafts.filter(
                    (d) => !apprLocal[d.id],
                ).length;

                return (
                    <div className="shell">
                        {/* HEADER */}
                        <header className="header">
                            {/* Logo group */}
                            <div className="h-logo">
                                <img
                                    src="/static/logo.jpg"
                                    alt="CEPAT"
                                    className="h-logo-img"
                                />
                                <span className="h-title">CEPAT</span>
                            </div>
                            <div className="h-divider"></div>
                            <div className="h-center">
                                {tweaks.emergency ? (
                                    <div className="status-pill em">
                                        <div className="sp-dot r"></div>
                                        <span className="status-text-desktop">
                                            ACTIVE STANDBY — Earthquake{" "}
                                            {mag ? `M${mag.toFixed(1)}` : "M?"}{" "}
                                            {loc}
                                        </span>
                                        <span className="status-text-mobile">
                                            ACTIVE STANDBY
                                        </span>
                                    </div>
                                ) : (
                                    <div className="status-pill ok">
                                        <div className="sp-dot g"></div>
                                        <span>System Normal</span>
                                    </div>
                                )}
                            </div>

                            <div className="h-right">
                                <Clock />
                                <div className="h-sep"></div>
                                <button
                                    className={`h-icon-btn${isLight ? " active" : ""}`}
                                    onClick={toggleTheme}
                                    title={
                                        isLight
                                            ? "Switch to dark mode"
                                            : "Switch to light mode"
                                    }
                                >
                                    {isLight ? I.moon : I.sun}
                                </button>
                                <div style={{ position: "relative" }}>
                                    <button
                                        className={`h-icon-btn${notifOpen ? " active" : ""}`}
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            setNotifOpen((v) => !v);
                                        }}
                                        style={{ position: "relative" }}
                                    >
                                        {I.bell}
                                        {totalBadge > 0 && (
                                            <div className="h-notif-badge">
                                                {totalBadge > 99
                                                    ? "99+"
                                                    : totalBadge}
                                            </div>
                                        )}
                                    </button>
                                    {notifOpen && (
                                        <div
                                            style={{
                                                position: "absolute",
                                                top: "calc(100% + 6px)",
                                                right: 0,
                                                width: 260,
                                                background: "var(--surface)",
                                                border: "1px solid var(--border-2)",
                                                borderRadius: "var(--r)",
                                                boxShadow: "0 8px 24px rgba(0,0,0,0.3)",
                                                zIndex: 200,
                                                overflow: "hidden",
                                            }}
                                            onClick={(e) => e.stopPropagation()}
                                        >
                                            <div style={{ padding: "8px 12px", borderBottom: "1px solid var(--border)", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                                                <span style={{ fontSize: 10, fontWeight: 600, color: "var(--text-2)", letterSpacing: "0.08em", textTransform: "uppercase" }}>Notifikasi</span>
                                                {totalBadge > 0 && (
                                                    <span style={{ fontFamily: "var(--mono)", fontSize: 9, fontWeight: 700, background: "var(--surface-2)", color: "var(--red)", border: "1px solid var(--border)", borderRadius: "var(--r)", padding: "1px 5px" }}>{totalBadge}</span>
                                                )}
                                            </div>
                                            <div>
                                                {newAlerts > 0 && (
                                                    <div
                                                        style={{ padding: "9px 12px", borderBottom: "1px solid var(--border)", cursor: "pointer", display: "flex", gap: 8, alignItems: "flex-start" }}
                                                        onClick={() => { setNav("Monitor"); setNotifOpen(false); }}
                                                        onMouseEnter={e => e.currentTarget.style.background = "var(--surface-2)"}
                                                        onMouseLeave={e => e.currentTarget.style.background = ""}
                                                    >
                                                        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="var(--orange)" strokeWidth="1.5" style={{ marginTop: 1, flexShrink: 0 }}>
                                                            <path d="M7 1.5 L12.5 11.5 H1.5 Z" strokeLinecap="round" strokeLinejoin="round"/>
                                                            <line x1="7" y1="5.5" x2="7" y2="8" strokeLinecap="round"/>
                                                            <circle cx="7" cy="10" r="0.5" fill="var(--orange)"/>
                                                        </svg>
                                                        <div>
                                                            <div style={{ fontSize: 11, color: "var(--text-1)", fontWeight: 500 }}>{newAlerts} new earthquakes not acknowledged</div>
                                                            <div style={{ fontSize: 10, color: "var(--text-3)", marginTop: 1 }}>Buka halaman Monitor</div>
                                                        </div>
                                                    </div>
                                                )}
                                                {pendingCount > 0 && (
                                                    <div
                                                        style={{ padding: "9px 12px", cursor: "pointer", display: "flex", gap: 8, alignItems: "flex-start" }}
                                                        onClick={() => { setNav("Queue"); setNotifOpen(false); }}
                                                        onMouseEnter={e => e.currentTarget.style.background = "var(--surface-2)"}
                                                        onMouseLeave={e => e.currentTarget.style.background = ""}
                                                    >
                                                        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="var(--blue)" strokeWidth="1.5" style={{ marginTop: 1, flexShrink: 0 }}>
                                                            <rect x="2" y="1" width="10" height="12" rx="1.5"/>
                                                            <line x1="4.5" y1="4.5" x2="9.5" y2="4.5" strokeLinecap="round"/>
                                                            <line x1="4.5" y1="7" x2="9.5" y2="7" strokeLinecap="round"/>
                                                            <line x1="4.5" y1="9.5" x2="7.5" y2="9.5" strokeLinecap="round"/>
                                                        </svg>
                                                        <div>
                                                            <div style={{ fontSize: 11, color: "var(--text-1)", fontWeight: 500 }}>{pendingCount} drafts pending approval</div>
                                                            <div style={{ fontSize: 10, color: "var(--text-3)", marginTop: 1 }}>Open Queue page</div>
                                                        </div>
                                                    </div>
                                                )}
                                                {totalBadge === 0 && (
                                                    <div style={{ padding: "14px 12px", textAlign: "center", color: "var(--text-3)", fontSize: 11 }}>
                                                        No new notifications
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                </div>
                                <a
                                    href="/logout"
                                    title="Logout"
                                    style={{ textDecoration: "none" }}
                                >
                                    <div
                                        className="h-av"
                                        title={`Logged in as: ${operator || "?"} · Click to logout`}
                                    >
                                        {operator
                                            ? operator
                                                  .substring(0, 2)
                                                  .toUpperCase()
                                            : "OP"}
                                    </div>
                                </a>
                            </div>
                        </header>

                        {/* CONTENT */}
                        <main
                            className={`content${
                                nav === "Queue" ? " content-antrean" : ""
                            }`}
                        >
                            {nav === "Monitor" && (
                                <PageMonitor
                                    mag={mag}
                                    depth={depth}
                                    lat={lat}
                                    lon={lon}
                                    loc={loc}
                                    ts={ts}
                                    stats={stats}
                                    pendingDrafts={pendingDrafts}
                                    apprLocal={apprLocal}
                                    draftContents={draftContents}
                                    agentFeed={agentFeed}
                                    act={act}
                                    openEdit={openEdit}
                                    tweaks={tweaks}
                                    setNav={setNav}
                                />
                            )}
                            {nav === "Queue" && (
                                <PageAntrean
                                    pendingDrafts={pendingDrafts}
                                    apprLocal={apprLocal}
                                    draftContents={draftContents}
                                    onAct={act}
                                    onEdit={openEdit}
                                    fetchData={fetchData}
                                />
                            )}
                            {nav === "Reports" && <PageLaporan />}
                            {nav === "Analytics" && <PageAnalitik />}
                            {nav === "Logs" && <PageLog />}
                            {false && (
                                <>
                                    <div className="kpi-row">
                                        <div className="kpi">
                                            <div className="kpi-accent red"></div>
                                            <div className="kpi-num red">
                                                {mag ? mag.toFixed(1) : "—"}
                                            </div>
                                            <div className="kpi-label">
                                                Detected Magnitude
                                            </div>
                                            <div className="kpi-sub">
                                                {loc} · {ts}
                                            </div>
                                        </div>
                                        <div className="kpi">
                                            <div className="kpi-accent orange"></div>
                                            <div
                                                className="kpi-num orange"
                                                style={{
                                                    letterSpacing: "-0.03em",
                                                }}
                                            >
                                                {stats
                                                    ? Math.min(stats.total, 999)
                                                    : 0}
                                                <span
                                                    style={{
                                                        fontSize: 22,
                                                        color: "var(--text-3)",
                                                        fontWeight: 400,
                                                    }}
                                                >
                                                    &thinsp;
                                                </span>
                                            </div>
                                            <div className="kpi-label">
                                                Total Earthquakes Logged
                                            </div>
                                            <div className="kpi-sub">
                                                {stats
                                                    ? stats.high_magnitude
                                                    : 0}{" "}
                                                di atas M5.0
                                            </div>
                                        </div>
                                        <div className="kpi">
                                            <div
                                                className={`kpi-accent ${stats && stats.agent && stats.agent.mode === "ACTIVE" ? "red" : "green"}`}
                                            ></div>
                                            <div
                                                className={`kpi-num kpi-num-text ${stats && stats.agent && stats.agent.mode === "ACTIVE" ? "red" : "green"}`}
                                            >
                                                {stats && stats.agent
                                                    ? stats.agent.mode
                                                    : "STANDBY"}
                                            </div>
                                            <div className="kpi-label">
                                                Orchestrator Mode
                                            </div>
                                            <div className="kpi-sub">
                                                Cycles:{" "}
                                                {stats && stats.agent
                                                    ? stats.agent.cycles
                                                    : 0}
                                            </div>
                                        </div>
                                        <div className="kpi">
                                            <div className="kpi-accent blue"></div>
                                            <div className="kpi-num blue">
                                                {
                                                    pendingDrafts.filter(
                                                        (d) => !apprLocal[d.id],
                                                    ).length
                                                }
                                            </div>
                                            <div className="kpi-label">
                                                Pending Approval
                                            </div>
                                            <div className="kpi-sub">
                                                Public communication drafts
                                            </div>
                                        </div>
                                    </div>

                                    {/* MAIN */}
                                    <div className="main-grid">
                                        {/* LEFT COL */}
                                        <div className="col">
                                            {/* Flat Map card */}
                                            <div className="card map-shell">
                                                <div className="map-wrap">
                                                    <div
                                                        id="map"
                                                        aria-label="Peta gempa"
                                                    ></div>
                                                    <div className="map-tag">
                                                        <div className="m-dot"></div>
                                                        <span className="m-tag-txt">
                                                            ACTIVE EPICENTER
                                                        </span>
                                                    </div>
                                                    <div className="map-hint">
                                                        CLICK MARKER
                                                    </div>
                                                </div>
                                                <div className="map-data">
                                                    <div className="md-item">
                                                        <div className="md-label">
                                                            Magnitudo
                                                        </div>
                                                        <div className="md-val r">
                                                            {mag
                                                                ? `M ${mag.toFixed(1)}`
                                                                : "—"}
                                                        </div>
                                                    </div>
                                                    <div className="md-item">
                                                        <div className="md-label">
                                                            Depth
                                                        </div>
                                                        <div className="md-val">
                                                            {depth !== null
                                                                ? `${depth} km`
                                                                : "—"}
                                                        </div>
                                                    </div>
                                                    <div className="md-item">
                                                        <div className="md-label">
                                                            Coordinates
                                                        </div>
                                                        <div className="md-val">
                                                            {lat !== null &&
                                                            lon !== null
                                                                ? `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`
                                                                : "—"}
                                                        </div>
                                                    </div>
                                                    <div className="md-item">
                                                        <div className="md-label">
                                                            Updated
                                                        </div>
                                                        <div
                                                            className="md-val"
                                                            style={{
                                                                color: "var(--text-3)",
                                                            }}
                                                        >
                                                            {ts}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Grafik Frekuensi Gempa */}
                                            <div className="card seis-card">
                                                <div
                                                    className="card-head"
                                                    style={{ paddingBottom: 8 }}
                                                >
                                                    <span className="card-head-title">
                                                        Frekuensi Gempa (24 Jam
                                                        Terakhir)
                                                    </span>
                                                    <span
                                                        className="card-head-meta"
                                                        style={{
                                                            display: "flex",
                                                            alignItems:
                                                                "center",
                                                            gap: 5,
                                                        }}
                                                    >
                                                        <span
                                                            style={{
                                                                width: 5,
                                                                height: 5,
                                                                borderRadius:
                                                                    "50%",
                                                                background:
                                                                    "#3FB950",
                                                                display:
                                                                    "inline-block",
                                                            }}
                                                        ></span>
                                                        DATA REAL · DIPERBARUI
                                                        TIAP 5 MENIT
                                                    </span>
                                                </div>
                                                <EarthquakeChart
                                                    theme={tweaks.uiTheme}
                                                />
                                            </div>

                                            {/* Agent feed */}
                                            <div className="card feed-card">
                                                <div
                                                    className="card-head"
                                                    style={{ paddingBottom: 8 }}
                                                >
                                                    <span className="card-head-title">
                                                        Agent Activity
                                                    </span>
                                                    <span className="card-head-meta">
                                                        LIVE
                                                    </span>
                                                </div>
                                                <div className="feed-body">
                                                    {agentFeed.map((r, i) => (
                                                        <div
                                                            className="feed-row"
                                                            key={i}
                                                        >
                                                            <div
                                                                className={`f-status ${r.st}`}
                                                            >
                                                                {r.st ===
                                                                    "ok" && "✓"}
                                                                {r.st ===
                                                                    "proc" && (
                                                                    <div className="f-proc-dots">
                                                                        <i />
                                                                        <i />
                                                                        <i />
                                                                    </div>
                                                                )}
                                                                {r.st ===
                                                                    "wait" &&
                                                                    "○"}
                                                            </div>
                                                            <div className="f-info">
                                                                <div className="f-agent">
                                                                    {r.ag}
                                                                </div>
                                                                <div className="f-detail">
                                                                    {r.d}
                                                                </div>
                                                            </div>
                                                            <div className="f-time">
                                                                {r.ts}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        {/* RIGHT COL */}
                                        <div className="col">
                                            <div className="card appr-panel">
                                                <div className="card-head">
                                                    <span
                                                        className="card-head-title"
                                                        style={{
                                                            display: "flex",
                                                            alignItems:
                                                                "center",
                                                            gap: 7,
                                                        }}
                                                    >
                                                        Approval Queue
                                                        <span
                                                            className={`cpill${pendingDrafts.length === 0 ? " zero" : ""}`}
                                                        >
                                                            {pendingDrafts.length ===
                                                            0
                                                                ? "✓"
                                                                : pendingDrafts.length}
                                                        </span>
                                                    </span>
                                                    {pendingDrafts.length > 0 && (
                                                        <button
                                                            onClick={() => setNav("Antrean")}
                                                            style={{
                                                                background: "none",
                                                                border: "none",
                                                                color: "var(--blue)",
                                                                fontSize: "11px",
                                                                fontWeight: "600",
                                                                cursor: "pointer",
                                                                padding: "4px 8px",
                                                                borderRadius: "4px",
                                                                transition: "all 0.2s",
                                                            }}
                                                            className="hover-opacity"
                                                        >
                                                            View All →
                                                        </button>
                                                    )}
                                                </div>
                                                <div className="appr-body">
                                                    {pendingDrafts.length ===
                                                    0 ? (
                                                        <div
                                                            style={{
                                                                padding: "20px",
                                                                textAlign:
                                                                    "center",
                                                                color: "var(--text-3)",
                                                            }}
                                                        >
                                                            Tidak ada draf yang
                                                            menunggu
                                                            persetujuan.
                                                        </div>
                                                    ) : (
                                                        pendingDrafts.slice(0, 8).map(
                                                            (d) => (
                                                                <ACard
                                                                    key={d.id}
                                                                    id={d.id}
                                                                    agent="Communication Agent"
                                                                    type={`${d.draft_type ? d.draft_type.replace("_", " ").toUpperCase() : "DRAFT"} · ID:${d.id}`}
                                                                    urgent={
                                                                        d.magnitude >=
                                                                        6.0
                                                                    }
                                                                    preview={
                                                                        draftContents[
                                                                            d.id
                                                                        ] ||
                                                                        d.content
                                                                    }
                                                                    status={
                                                                        apprLocal[
                                                                            d.id
                                                                        ]
                                                                    }
                                                                    onAct={act}
                                                                    onEdit={
                                                                        openEdit
                                                                    }
                                                                />
                                                            ),
                                                        )
                                                    )}
                                                </div>
                                                <div className="audit">
                                                    <div className="audit-ttl">
                                                        Recent Activity
                                                    </div>
                                                    {logs.length === 0 ? (
                                                        <div className="audit-row">
                                                            <span
                                                                className="audit-txt"
                                                                style={{
                                                                    color: "var(--text-3)",
                                                                }}
                                                            >
                                                                Belum ada
                                                                aktivitas
                                                                persetujuan.
                                                            </span>
                                                        </div>
                                                    ) : (
                                                        logs.map((r, i) => (
                                                            <div
                                                                className="audit-row"
                                                                key={i}
                                                            >
                                                                <span className="audit-ts">
                                                                    {r.ts}
                                                                </span>
                                                                <span className="audit-txt">
                                                                    {r.msg}
                                                                </span>
                                                            </div>
                                                        ))
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}
                        </main>

                        {/* FLOATING BOTTOM NAV */}
                        <nav className="bottom-nav" aria-label="Primary">
                            {NAV.map(({ k, ic, badgeKey }) => {
                                const badge =
                                    badgeKey === "pending" ? antreanBadge : 0;
                                return (
                                    <button
                                        key={k}
                                        className={`bn-item${nav === k ? " active" : ""}`}
                                        onClick={() => setNav(k)}
                                        type="button"
                                        aria-pressed={nav === k}
                                    >
                                        {ic}
                                        <span>{k}</span>
                                        {badge > 0 && (
                                            <span className="bn-badge">
                                                {badge}
                                            </span>
                                        )}
                                    </button>
                                );
                            })}
                        </nav>

                        {/* Modal Edit Draftt */}
                        {editModal && (
                            <EditModal
                                draft={editModal}
                                onClose={() => setEditModal(null)}
                                onSaved={onEditSaved}
                            />
                        )}

                        {/* Toast */}
                        {toast && <Toast msg={toast} />}
                    </div>
                );
            }

            ReactDOM.createRoot(document.getElementById("root")).render(
                <App />,
            );
        </script>
    </body>
</html>
{% endraw %}
