                        {/* Overlay tags */}
                        <div className="map-tag">
                            <div className="m-dot"></div>
                            <span className="m-tag-txt">ACTIVE EPICENTER</span>
                        </div>
                        <div className="map-hint">HOVER MARKERS</div>
                    </div>
                );
            }

            /* ─ EarthquakeChart — Frekuensi Gempa 24 Jam (data real dari DB) ───────── */
            function EarthquakeChart({ theme }) {
                const [hourly, setHourly] = useState([]);
                const isLight = theme === "light";

                useEffect(() => {
                    let alive = true;
                    const load = async () => {
                        try {
                            const res = await fetch("/api/earthquakes/hourly");
                            if (res.ok && alive) {
                                const j = await res.json();
                                setHourly(j.data || []);
                            }
                        } catch (e) {
                            console.error("hourly fetch error", e);
                        }
                    };
                    load();
                    const t = setInterval(load, 5 * 60 * 1000); // refresh tiap 5 menit
                    return () => {
                        alive = false;
                        clearInterval(t);
                    };
                }, []);

                const W = 600,
                    H = 130;
                const PAD = { top: 12, right: 16, bottom: 28, left: 32 };
                const chartW = W - PAD.left - PAD.right;
                const chartH = H - PAD.top - PAD.bottom;

                const maxCount = Math.max(...hourly.map((d) => d.count), 1);
                const barW = chartW / 24;

                const bgColor = isLight ? "#F4F7FA" : "#060A08";
                const gridColor = isLight
                    ? "rgba(30,40,50,0.08)"
                    : "rgba(255,255,255,0.05)";
                const labelColor = isLight ? "#9BA2A9" : "#3D444D";
                const barNormal = isLight
                    ? "rgba(88,166,255,0.55)"
                    : "rgba(88,166,255,0.45)";
                const barHigh = isLight
                    ? "rgba(248,81,73,0.75)"
                    : "rgba(248,81,73,0.85)";
                const now = new Date().getHours();

                return (
                    <div className="seis-wrap" style={{ background: bgColor }}>
                        {hourly.length === 0 ? (
                            <div
                                style={{
                                    position: "absolute",
                                    inset: 0,
                                    display: "flex",
                                    alignItems: "center",
                                    justifyContent: "center",
                                    color: labelColor,
                                    fontSize: 11,
                                    fontFamily: "var(--mono)",
                                }}
                            >
                                Loading data...
                            </div>
                        ) : (
                            <svg
                                viewBox={`0 0 ${W} ${H}`}
                                preserveAspectRatio="xMidYMid meet"
                                style={{
                                    position: "absolute",
                                    inset: 0,
                                    width: "100%",
                                    height: "100%",
                                }}
                            >
                                {/* Grid lines horizontal */}
                                {[0, 0.5, 1].map((f, i) => {
                                    const y = PAD.top + chartH * (1 - f);
                                    return (
                                        <line
                                            key={i}
                                            x1={PAD.left}
                                            y1={y}
                                            x2={W - PAD.right}
                                            y2={y}
                                            stroke={gridColor}
                                            strokeWidth="0.8"
                                            strokeDasharray={
                                                f === 0 ? "none" : "3 4"
                                            }
                                        />
                                    );
                                })}

                                {/* Bars */}
                                {hourly.map((d, i) => {
                                    const bH =
                                        d.count > 0
                                            ? Math.max(
                                                  3,
                                                  (d.count / maxCount) * chartH,
                                              )
                                            : 0;
                                    const bX =
                                        PAD.left + i * barW + barW * 0.15;
                                    const bY = PAD.top + chartH - bH;
                                    const bW = barW * 0.7;
                                    const isHighMag = d.max_mag >= 5.0;
                                    const isCurrent = i === now;
                                    return (
                                        <g key={i}>
                                            {bH > 0 && (
                                                <rect
                                                    x={bX}
                                                    y={bY}
                                                    width={bW}
                                                    height={bH}
                                                    rx="2"
                                                    fill={
                                                        isHighMag
                                                            ? barHigh
                                                            : barNormal
                                                    }
                                                    opacity={
                                                        isCurrent ? 1 : 0.8
                                                    }
                                                />
                                            )}
                                            {/* Dot untuk jam sekarang */}
                                            {isCurrent && (
                                                <circle
                                                    cx={bX + bW / 2}
                                                    cy={PAD.top + chartH + 6}
                                                    r={2.5}
                                                    fill="var(--blue)"
                                                />
                                            )}
                                        </g>
                                    );
                                })}

                                {/* Label jam X-axis */}
                                {[0, 3, 6, 9, 12, 15, 18, 21].map((h) => (
                                    <text
                                        key={h}
                                        x={PAD.left + h * barW + barW / 2}
                                        y={H - 4}
                                        textAnchor="middle"
                                        fontSize="8"
                                        fill={labelColor}

                        };

                    stateRef.current.zoomTo = (lat, lon, zDist) => {

                            fromRotY: rotY,

                            fromRotX: rotX,

                            fromZ: camCurrent.z,

                            fromFov: camCurrent.fov,
                            toFov: 28,
                            start: performance.now(),
                            dur: 900,
                        };
                    };

                    const easeInOut = (t) =>
                        t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

                    const raycaster = new T.Raycaster();
                    const mouse2D = new T.Vector2();

                        mouse2D.x =

                        mouse2D.y =
                            -((e.clientY - rect.top) / rect.height) * 2 + 1;

                            onMarkerClick && onMarkerClick(mk);
                            stateRef.current.zoomTo(mk.lat, mk.lon, mk.zoom);
                        }

                        raf = requestAnimationFrame(tick);
                        const now = performance.now();

                        epicenterRings.forEach((r) => {
                            const p = (t * 0.75 + r.userData.ph) % 1;
                            r.scale.setScalar(0.5 + p * 2.8);

                        });

                            snapT = Math.min(snapT + 1, 120);

                            rotY = ((-99.7 * Math.PI) / 180) * e;
                            globe.rotation.y = rotY;
                            globe.rotation.x = 0;
                            if (snapT >= 120) {
                                snapPhase = "idle";
                            }
                        }

                            const elapsed = now - zoomAnim.start;
                            const p = Math.min(elapsed / zoomAnim.dur, 1);
                            const ep = easeInOut(p);
                            // Interpolate rotation — handle wrap-around
                            let dY = zoomAnim.toRotY - zoomAnim.fromRotY;
                            while (dY > Math.PI) dY -= 2 * Math.PI;
                            while (dY < -Math.PI) dY += 2 * Math.PI;
                            rotY = zoomAnim.fromRotY + dY * ep;
                            rotX =
                                zoomAnim.fromRotX +
                                (zoomAnim.toRotX - zoomAnim.fromRotX) * ep;
                            camCurrent.z =
                                zoomAnim.fromZ +
                                (zoomAnim.toZ - zoomAnim.fromZ) * ep;
                            camCurrent.fov =
                                zoomAnim.fromFov +
                                (zoomAnim.toFov - zoomAnim.fromFov) * ep;
                            cam.fov = camCurrent.fov;
                            cam.updateProjectionMatrix();
                            cam.position.z = camCurrent.z;
                            globe.rotation.y = rotY;
                            globe.rotation.x = rotX;
                            if (p >= 1) {
                                zoomAnim = null;
                                snapPhase = "idle";
                            }

                    const ro = new ResizeObserver(() => {

                            H2 = el.clientHeight;
                        renderer.setSize(W2, H2);
                        cam.aspect = W2 / H2;
                        cam.updateProjectionMatrix();
                    });
                    ro.observe(el);

                    return () => {
                        cancelAnimationFrame(raf);
                        ro.disconnect();
                        el.removeEventListener("click", onCanvasClick);
                        renderer.dispose();
                    };

                            );
                    }
                }, [zoomTarget]);

                return <canvas ref={canvasRef} id="gc3" />;
            }

            /* ─ ResourceMappingViewer ─────────────────────────────────────────────────── */
            function ResourceMappingViewer({ text }) {
                if (!text) return null;
                
                const parseData = () => {
                    const categories = {
                        personel: { name: "Personel", icon: "🧑‍🚒", items: [], recommendations: [] },

                    const getCategory = (name) => {
                        const n = name.toLowerCase();
                        if (n.includes("personel") || n.includes("human") || n.includes("petugas")) return categories.personel;
                        if (n.includes("logistik") || n.includes("bantuan") || n.includes("makanan") || n.includes("sembako")) return categories.logistik;
                        if (n.includes("peralatan") || n.includes("kendaraan") || n.includes("alat") || n.includes("mobil")) return categories.peralatan;
                        return null;
                    };
                    
                    const cleanStr = (s) => s.replace(/^[-•*\s]+/, "").trim();
                    
                    const parseVal = (v) => {
                        if (v === undefined || v === null) return 0;
                        if (typeof v === 'number') return v;
                        const match = String(v).trim().match(/^([\d.]+)/);
                        return match ? parseFloat(match[1]) : NaN;
                    };

                    const getUnit = (v) => {
                        if (v === undefined || v === null) return "";
                        if (typeof v === 'number') return "";
                        const match = String(v).trim().match(/^[\d.]+\s*(.*)$/);
                        return (match && match[1]) ? match[1].trim() : "";
                    };
                    
                    // Smart helper to extract name and quantity from items like "2 Tim SAR" or "10-15 Tim SAR"
                    const extractResourceDetails = (str) => {
                        const s = str.trim();
                        if (!s) return null;
                        
                        // Pattern 1: Number/Range + Unit prefix, e.g. "1-2 kontainer Obat-obatan dasar"
                        const regexPrefix = /^(?:[-•*]\s*)?([\d\-]+(?:\s+(?:kontainer|liter|unit|orang|paket|box|ton|m2))?)\s+(.*)$/i;
                        const matchPrefix = s.match(regexPrefix);
                        if (matchPrefix) {
                            return {
                                quantity: matchPrefix[1].trim(),
                                name: matchPrefix[2].trim()
                            };
                        }
                        
                        // Pattern 2: Number/Range prefix only, e.g. "2 Tim SAR", "10-15 Tim SAR"
                        const regexNum = /^(?:[-•*]\s*)?([\d\-]+)\s+(.*)$/;
                        const matchNum = s.match(regexNum);
                        if (matchNum) {
                            return {
                                quantity: matchNum[1].trim(),
                                name: matchNum[2].trim()
                            };
                        }
                        
                        // Pattern 3: Key-value with colon suffix, e.g. "Tim SAR: 2"
                        const regexSuffix = /^(?:[-•*]\s*)?(.*?)\s*:\s*([\d\-]+(?:\s+(?:kontainer|liter|unit|orang|paket|box|ton|m2))?)$/i;
                        const matchSuffix = s.match(regexSuffix);
                        if (matchSuffix) {
                            return {
                                quantity: matchSuffix[2].trim(),
                                name: matchSuffix[1].trim()
                            };
                        }
                        
                        // Fallback
                        return {
                            quantity: "",
                            name: s.replace(/^(?:[-•*]\s*)/, "").trim()
                        };
                    };

                    // Try parsing as JSON/Python dict
                    const trimmedText = text.trim();
                    if (trimmedText.startsWith("{") && trimmedText.endsWith("}")) {
                        try {
                            let parsedObj = null;
                            try {
                                const doubleQuoted = trimmedText
                                    .replace(/'/g, '"')
                                    .replace(/True/g, 'true')
                                    .replace(/False/g, 'false')
                                    .replace(/None/g, 'null');
                                parsedObj = JSON.parse(doubleQuoted);
                            } catch (e) {
                                parsedObj = (new Function(`return (${trimmedText})`))();
                            }
                            
                            if (parsedObj && typeof parsedObj === "object") {
                                let hasData = false;
                                for (const [catKey, catVal] of Object.entries(parsedObj)) {
                                    const targetCat = getCategory(catKey);
                                    if (targetCat && typeof catVal === "object") {
                                        let ketersediaan = {};
                                        let kebutuhan = {};
                                        for (const [subKey, subVal] of Object.entries(catVal)) {
                                            const subK = subKey.toLowerCase();
                                            if (subK.includes("sedia") || subK.includes("ada") || subK.includes("avail")) {
                                                ketersediaan = subVal || {};
                                            } else if (subK.includes("butuh") || subK.includes("minta") || subK.includes("req")) {
                                                kebutuhan = subVal || {};
                                            }
                                        }
                                        
                                        const allItems = new Set([...Object.keys(ketersediaan), ...Object.keys(kebutuhan)]);
                                        for (const itemName of allItems) {
                                            const tersedia = ketersediaan[itemName] !== undefined ? ketersediaan[itemName] : 0;
                                            const kebutuhanVal = kebutuhan[itemName] !== undefined ? kebutuhan[itemName] : 0;
                                            
                                            let kekurangan = "";
                                            const avNum = parseVal(tersedia);
                                            const reqNum = parseVal(kebutuhanVal);
                                            if (!isNaN(avNum) && !isNaN(reqNum) && avNum < reqNum) {
                                                kekurangan = String(reqNum - avNum);
                                            }
                                            
                                            let statusText = "Terpenuhi ✓";
                                            let statusType = "success";
                                            if (kekurangan) {
                                                statusText = `Kurang ${kekurangan}`;
                                                statusType = "warning";
                                            }
                                            
                                            targetCat.items.push({
                                                name: itemName,
                                                tersedia: tersedia,
                                                kebutuhan: kebutuhanVal,
                                                statusText: statusText,
                                                statusType: statusType
                                            });
                                            hasData = true;
                                        }
                                    }
                                }
                                if (hasData) return categories;
                            }
                        } catch (err) {
                            console.error("Failed to parse resource mapping dict:", err);
                        }
                    }
                    
                    // Parse line-by-line formatted string
                    const lines = text.split('\n');
                    let currentCategory = null;
                    let currentSection = ''; // 'tersedia', 'kebutuhan', 'kekurangan'
                    let tempTersedia = {};
                    let tempKebutuhan = {};
                    let tempKekurangan = {};
                    let hasData = false;
                    
                    const commitCategory = (cat) => {
                        if (!cat) return;
                        const allNames = new Set([
                            ...Object.keys(tempTersedia),
                            ...Object.keys(tempKebutuhan),
                            ...Object.keys(tempKekurangan)
                        ]);
                        
                        for (const name of allNames) {
                            if (!name) continue;
                            if (cat.items.some(it => it.name.toLowerCase() === name.toLowerCase())) continue;
                            
                            const tersedia = tempTersedia[name] || "0";
                            const kebutuhan = tempKebutuhan[name] || "0";
                            const kekurangan = tempKekurangan[name] || "";
                            
                            let statusText = "Terpenuhi ✓";
                            let statusType = "success";
                            
                            if (kekurangan) {
                                const isZero = kekurangan === "0" || kekurangan === "Terpenuhi" || kekurangan.toLowerCase() === "cukup" || kekurangan.toLowerCase() === "tidak ada";
                                if (isZero) {
                                    statusText = "Terpenuhi ✓";
                                    statusType = "success";
                                } else {
                                    statusText = `Kurang ${kekurangan}`;
                                    statusType = "warning";
                                }
                            } else {
                                const avNum = parseVal(tersedia);
                                const reqNum = parseVal(kebutuhan);
                                const unit = getUnit(kebutuhan) || getUnit(tersedia);
                                
                                if (!isNaN(avNum) && !isNaN(reqNum)) {
                                    if (avNum >= reqNum) {
                                        statusText = "Terpenuhi ✓";
                                        statusType = "success";
                                    } else {
                                        const diff = reqNum - avNum;
                                        statusText = `Kurang ${diff}${unit ? " " + unit : ""}`;
                                        statusType = "warning";
                                    }
                                } else {
                                    if (tersedia === kebutuhan && tersedia !== "0") {
                                        statusText = "Terpenuhi ✓";
                                        statusType = "success";
                                    } else if (tersedia && tersedia !== "0" && !kebutuhan) {
                                        statusText = "Tersedia ✓";
                                        statusType = "success";
                                    } else {
                                        statusText = "Kurang / Cek";
                                        statusType = "warning";
                                    }
                                }
                            }
                            
                            cat.items.push({
                                name: name,
                                tersedia: tersedia,
                                kebutuhan: kebutuhan,
                                statusText: statusText,
                                statusType: statusType
                            });
                            hasData = true;
                        }
                        
                        tempTersedia = {};
                        tempKebutuhan = {};
                        tempKekurangan = {};
                    };
                    
                    const parseItemsList = (str, targetMap) => {
                        const parts = str.split(",");
                        for (const part of parts) {
                            const details = extractResourceDetails(part);
                            if (details) {
                                targetMap[details.name] = details.quantity || "Ada";
                            }
                        }
                    };

                    for (let i = 0; i < lines.length; i++) {
                        let line = lines[i].trim();
                        if (!line) continue;
                        
                        if (line.startsWith("【") && line.includes("】")) {
                            commitCategory(currentCategory);
                            const catName = line.replace(/[【】]/g, '').trim();
                            currentCategory = getCategory(catName);
                            currentSection = '';
                            continue;
                        }
                        
                        const lowerLine = line.toLowerCase();
                        if (lowerLine.includes("ketersediaan:") || lowerLine.includes("tersedia:") || (lowerLine.includes("tersedia") && line.endsWith(":"))) {
                            currentSection = 'tersedia';
                            const colonIdx = line.indexOf(":");
                            const contentAfter = line.substring(colonIdx + 1).trim();
                            if (contentAfter) parseItemsList(contentAfter, tempTersedia);
                            continue;
                        } else if (lowerLine.includes("kebutuhan:") || lowerLine.includes("butuh:") || (lowerLine.includes("kebutuhan") && line.endsWith(":"))) {
                            currentSection = 'kebutuhan';
                            const colonIdx = line.indexOf(":");
                            const contentAfter = line.substring(colonIdx + 1).trim();
                            if (contentAfter) parseItemsList(contentAfter, tempKebutuhan);
                            continue;
                        } else if (lowerLine.includes("kekurangan:") || lowerLine.includes("kurang:") || lowerLine.includes("tambahan:") || (lowerLine.includes("kekurangan") && line.endsWith(":"))) {
                            currentSection = 'kekurangan';
                            const colonIdx = line.indexOf(":");
                            const contentAfter = line.substring(colonIdx + 1).trim();
                            if (contentAfter) parseItemsList(contentAfter, tempKekurangan);
                            continue;
                        }
                        
                        // Parse bullets
                        if (currentCategory && (line.startsWith("-") || line.startsWith("•") || line.startsWith("*"))) {
                            const cleaned = cleanStr(line);
                            const colonIdx = cleaned.indexOf(":");
                            if (colonIdx !== -1) {
                                const key = cleaned.substring(0, colonIdx).trim().toLowerCase();
                                const val = cleaned.substring(colonIdx + 1).trim();
                                
                                if (key.includes("tersedia") || key.includes("ketersediaan")) {
                                    parseItemsList(val, tempTersedia);
                                } else if (key.includes("kebutuhan") || key.includes("butuh")) {
                                    parseItemsList(val, tempKebutuhan);
                                } else if (key.includes("kekurangan") || key.includes("kurang") || key.includes("tambahan")) {
                                    parseItemsList(val, tempKekurangan);
                                } else {
                                    // Bullet with details like "- Tim SAR: 2" inside a section
                                    const details = extractResourceDetails(cleaned);
                                    if (details) {
                                        if (currentSection === 'tersedia') tempTersedia[details.name] = details.quantity;
                                        else if (currentSection === 'kebutuhan') tempKebutuhan[details.name] = details.quantity;
                                        else if (currentSection === 'kekurangan') tempKekurangan[details.name] = details.quantity;
                                    }
                                }
                            } else {
                                currentCategory.recommendations.push(cleaned);
                                hasData = true;
                            }
                            continue;
                        }
                        
                        // Parsing plain fallback text (e.g. "Personel: Kerahkan tim SAR...")
                        const colonIdx = line.indexOf(":");
                        if (colonIdx !== -1) {
                            const key = line.substring(0, colonIdx).trim();
                            const val = line.substring(colonIdx + 1).trim();
                            const cat = getCategory(key);
                            if (cat) {
                                const recommendationsList = val.split(/[,;]/).map(p => cleanStr(p)).filter(Boolean);
                                cat.recommendations.push(...recommendationsList);
                                hasData = true;
                            }
                        } else {
                            if (currentCategory) {
                                currentCategory.recommendations.push(line);
                                hasData = true;
                            }
                        }
                    }
                    
                    commitCategory(currentCategory);
                    return hasData ? categories : null;
                };
                
                const parsed = parseData();
                
                if (!parsed) {
                    return (
                        <div style={{
                            fontSize: "11px",
                            color: "var(--text-1)",
                            lineHeight: 1.6,
                            background: "var(--surface-2)",
                            border: "1px solid var(--border)",
                            borderRadius: "8px",
                            padding: "12px 14px",
                            whiteSpace: "pre-wrap",
                            fontFamily: "var(--sans)",
                            display: "flex",
                            gap: "8px",
                            alignItems: "flex-start"
                        }}>
                            <span style={{ fontSize: "14px", color: "var(--blue)", marginTop: "2px" }}>ℹ️</span>
                            <div style={{ flex: 1 }}>{text}</div>
                        </div>
                    );
                }
                
                return (
                    <div style={{
                        display: "grid",
                        gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))",
                        gap: "16px",
                        marginTop: "6px"
                    }}>
                        {Object.values(parsed).map((cat) => {
                            if (cat.items.length === 0 && cat.recommendations.length === 0) return null;
                            
                            return (
                                <div 
                                    key={cat.name} 
                                    style={{
                                        background: "var(--surface-2)",
                                        border: "1px solid var(--border)",
                                        borderRadius: "8px",
                                        padding: "16px 18px",
                                        display: "flex",
                                        flexDirection: "column",
                                        gap: "14px",
                                        boxShadow: "0 1px 3px rgba(0,0,0,0.05)"
                                    }}
                                >
                                    {/* Header */}
                                    <div style={{
                                        display: "flex",
                                        alignItems: "center",
                                        gap: "8px",
                                        borderBottom: "1px solid var(--border)",
                                        paddingBottom: "8px"
                                    }}>
                                        <span style={{ fontSize: "16px" }}>{cat.icon}</span>
                                        <span style={{ 
                                            fontSize: "11px", 
                                            fontWeight: 700, 
                                            textTransform: "uppercase", 
                                            letterSpacing: "0.06em",
                                            color: "var(--text-1)" 
                                        }}>
                                            {cat.name}
                                        </span>
                                    </div>
                                    
                                    {/* Clean Comparative Table */}
                                    {cat.items.length > 0 && (
                                        <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                                            <div style={{ 
                                                display: "grid", 
                                                gridTemplateColumns: "1fr 50px 50px 85px", 
                                                gap: "8px", 
                                                paddingBottom: "6px", 
                                                borderBottom: "1px solid var(--border)", 
                                                fontSize: "9px", 
                                                fontWeight: 700, 
                                                color: "var(--text-3)", 
                                                textTransform: "uppercase",
                                                letterSpacing: "0.05em"
                                            }}>
                                                <span>Sumber Daya</span>
                                                <span style={{ textAlign: "right" }}>Sedia</span>
                                                <span style={{ textAlign: "right" }}>Butuh</span>
                                                <span style={{ textAlign: "right" }}>Status</span>
                                            </div>
                                            {cat.items.map((item, idx) => {
                                                const isWarning = item.statusType !== 'success';
                                                const statusColor = isWarning ? "var(--orange)" : "var(--green)";
                                                return (
                                                    <div 
                                                        key={idx} 
                                                        style={{ 
                                                            display: "grid", 
                                                            gridTemplateColumns: "1fr 50px 50px 85px", 
                                                            gap: "8px", 
                                                            alignItems: "center", 
                                                            padding: "6px 0", 
                                                            fontSize: "10px", 
                                                            borderBottom: idx < cat.items.length - 1 ? "1px solid rgba(255,255,255,0.02)" : "none" 
                                                        }}
                                                    >
                                                        <span style={{ fontWeight: 600, color: "var(--text-1)" }}>{item.name}</span>
                                                        <span style={{ textAlign: "right", color: "var(--green)", fontFamily: "var(--mono)", fontWeight: 500 }}>{item.tersedia}</span>
                                                        <span style={{ textAlign: "right", color: "var(--text-2)", fontFamily: "var(--mono)", fontWeight: 500 }}>{item.kebutuhan}</span>
                                                        
                                                        {/* Clean Minimalist Status */}
                                                        <span style={{ 
                                                            textAlign: "right", 
                                                            fontSize: "9px", 
                                                            color: statusColor, 
                                                            fontWeight: 600,
                                                            whiteSpace: "nowrap",
                                                            overflow: "hidden",
                                                            textOverflow: "ellipsis",
                                                            display: "inline-flex",
                                                            alignItems: "center",
                                                            justifyContent: "flex-end",
                                                            gap: "4px"
                                                        }} title={item.statusText}>
                                                            <span style={{ 
                                                                width: "5px", 
                                                                height: "5px", 
                                                                borderRadius: "50%", 
                                                                background: statusColor,
                                                                display: "inline-block"
                                                            }} />
                                                            {item.statusText}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                    
                                    {/* Clean Recommendations */}
                                    {cat.recommendations.length > 0 && (
                                        <div style={{ display: "flex", flexDirection: "column", gap: "6px", marginTop: cat.items.length > 0 ? "4px" : "0" }}>
                                            <div style={{ fontSize: "9px", fontWeight: 700, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.05em" }}>
                                                Rekomendasi Lapangan
                                            </div>
                                            <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                                                {cat.recommendations.map((rec, idx) => (
                                                    <div 
                                                        key={idx} 
                                                        style={{ 
                                                            fontSize: "10px", 
                                                            color: "var(--text-2)", 
                                                            lineHeight: 1.4,
                                                            paddingLeft: "10px",
                                                            position: "relative"
                                                        }}
                                                    >
                                                        <span style={{ 
                                                            position: "absolute", 
                                                            left: "0", 
                                                            color: "var(--text-3)" 
                                                        }}>•</span>
                                                        {rec}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                );
            }

            function EditModal({ draft, onClose, onSaved }) {
                const [content, setContent] = React.useState(
                    draft.content || "",
                );
                const [saving, setSaving] = React.useState(false);

                const handleSave = async () => {
                    if (!content.trim()) return;
                    setSaving(true);
                    try {
                        const res = await fetch(
                            `/api/approval/draft/${draft.id}/edit`,
                            {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    content: content.trim(),
                                }),
                            },
                        );
                        if (res.ok) {
                            onSaved(draft.id, content.trim());
                            onClose();
                        }
                    } catch (e) {
                        console.error("Edit error", e);
                    }
                    setSaving(false);
                };

                return (
                    <div
                        className="modal-overlay"
                        onClick={(e) =>
                            e.target === e.currentTarget && onClose()
                        }
                    >
                        <div className="modal-box">
                            <div className="modal-head">
                                <span className="modal-title">
                                    Edit Drafttt #{draft.id}
                                </span>
                                <button
                                    className="modal-close"
                                    onClick={onClose}
                                    type="button"
                                >
                                    ×
                                </button>
                            </div>
                            <div className="modal-body">
                                <textarea
                                    className="modal-textarea"
                                    value={content}
                                    onChange={(e) => setContent(e.target.value)}
                                    autoFocus
                                />
                                <div
                                    style={{
                                        fontSize: 10,
                                        color: "var(--text-3)",
                                        marginTop: 6,
                                    }}
                                >
                                    {content.length} karakter
                                </div>
                            </div>
                            <div className="modal-footer">
                                <button
                                    className="modal-btn cancel"
                                    onClick={onClose}
                                    type="button"
                                >
                                    Cancel
                                </button>
                                <button
                                    className="modal-btn save"
                                    onClick={handleSave}
                                    disabled={saving}
                                    type="button"
                                >
                                    {saving ? "Menyimpan..." : "✓ Simpan"}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* ─ Toast ───────────────────────────────────────────────────────────────── */
            function Toast({ msg }) {
                return (
                    <div className="toast">
                        <span>✓</span>
                        {msg}
                    </div>
                );
            }

            /* ─ Approval Card ────────────────────────────────────────────────────── */
            function ACard({
                id,
                agent,
                type,
                preview,
                urgent,
                status,
                onAct,
                onEdit,
            }) {
                return (
                    <div
                        className={`appr-card${status === "app" ? " app" : status === "rej" ? " rej" : ""}`}
                    >
                        <div className="ac-top">
                            <span className="ac-agent">{agent}</span>
                            <span className="ac-type">{type}</span>
                            <span
                                className={`ac-tag ${urgent ? "urg" : "nrm"}`}
                            >
                                {urgent ? "URGENT" : "NORMAL"}
                            </span>
                        </div>
                        <div className="ac-preview">{preview}</div>
                        {!status && (
                            <div className="ac-actions">
                                <button
                                    className="ac-btn a"
                                    onClick={() => onAct(id, "app")}
                                >
                                    ✓ Approve
                                </button>
                                <button
                                    className="ac-btn e"
                                    onClick={() => onEdit && onEdit(id)}
                                >
                                    ✎ Edit
                                </button>
                                <button
                                    className="ac-btn r"
                                    onClick={() => onAct(id, "rej")}
                                >
                                    ✗ Reject
                                </button>
                            </div>
                        )}
                        {status === "app" && (
                            <div className="done-over app">
                                <span>✓ APPROVED</span>
                            </div>
                        )}
                        {status === "rej" && (
                            <div className="done-over rej">
                                <span>✗ REJECTED</span>
                            </div>
                        )}
                    </div>
                );
            }

            /* ─ Page Components ────────────────────────────────────────────── */
            function PageMonitor({
                mag,
                depth,
                lat,
                lon,
                loc,
                ts,
                stats,
                pendingDrafts,
                apprLocal,
                draftContents,
                agentFeed,
                act,
                openEdit,
                tweaks,
                setNav,
            }) {
                const [allEarthquakes, setAllEarthquakes] = useState([]);
                const epicenter =
                    lat !== null && lon !== null && mag !== null
                        ? {
                              id: "ep",
                              lat,
                              lon,
                              label: `Episenter M${mag.toFixed(1)}`,
                              sub: loc,
                              type: "critical",
                          }
                        : DEFAULT_EPICENTER;

                useEffect(() => {
                    fetch("/api/earthquakes?limit=50")
                        .then((r) => r.json())
                        .then((j) => {
                            if (j.data) {
                                setAllEarthquakes(j.data);
                                setTimeout(() => {
                                    if (leafletMap) leafletMap.invalidateSize();
                                }, 300);
                            }
                        })
                        .catch(console.error);
                }, []);

                useEffect(() => {
                    ensureLeafletMap();
                    const handleResize = () => {
                        if (leafletMap) leafletMap.invalidateSize();
                    };
                    window.addEventListener("resize", handleResize);
                    return () => {
                        window.removeEventListener("resize", handleResize);
                        if (leafletMap) {
                            try {
                                leafletMap.remove();
                            } catch (e) {}
                            leafletMap = null;
                        }
                        eqMarkers.forEach((m) => {
                            try {
                                m.remove();
                            } catch (e) {}
                        });
                        eqMarkers = [];
                        epicenterMarker = null;
                        stationMarkers = [];
                        lastEpicenterKey = null;
                    };
                }, []);

                useEffect(() => {
                    updateEpicenterMarker(epicenter, mag);
                }, [epicenter.lat, epicenter.lon, mag]);

                useEffect(() => {
                    if (allEarthquakes.length > 0) {
                        updateAllEarthquakeMarkers(allEarthquakes);
                    }
                }, [allEarthquakes]);


                return (
                    <div>
                        <div className="kpi-row">
                            <div className="kpi">
                                <div className="kpi-accent red"></div>
                                <div className="kpi-num red">
                                    {mag ? mag.toFixed(1) : "—"}
                                </div>
                                <div className="kpi-label">
                                    Detected Magnitude
                                </div>
                                <div className="kpi-sub">
                                    {loc} · {ts}
                                </div>
                            </div>
                            <div className="kpi">
                                <div className="kpi-accent orange"></div>

            function AntreanModal({ item, apprLocal, planLocal, draftContents, onAct, onEdit, onClose, onActPlan, fetchAll }) {
                if (!item) return null;
                const isDraft = item._kind === "draft";
                const localSt = isDraft ? apprLocal[item.id] : planLocal[item.id];
                const effectiveSt = localSt
                    ? (localSt === "app" ? "APPROVED" : "REJECTED")
                    : item.status;
                const isUrgent = Number(item.magnitude) >= 6;
                const PRIORITY_COLORS = { P1: "var(--red)", P2: "var(--orange)", P3: "var(--blue)" };

                const handleBackdropClick = (e) => {
                    if (e.target === e.currentTarget) onClose();
                };

                useEffect(() => {
                    const onKey = (e) => { if (e.key === "Escape") onClose(); };
                    document.addEventListener("keydown", onKey);
                    return () => document.removeEventListener("keydown", onKey);
                }, []);

                const statusTag = {
                    DRAFT: (
                        <span style={{ fontSize: 9, fontWeight: 700, textTransform: "uppercase", padding: "3px 8px", borderRadius: 4, background: "rgba(210,153,34,0.06)", color: "var(--orange)", border: "1px solid rgba(210,153,34,0.18)", letterSpacing: "0.02em" }}>Menunggu</span>
                    ),
                    APPROVED: (
                        <span style={{ fontSize: 9, fontWeight: 700, textTransform: "uppercase", padding: "3px 8px", borderRadius: 4, background: "rgba(63,185,80,0.06)", color: "var(--green)", border: "1px solid rgba(63,185,80,0.18)", letterSpacing: "0.02em" }}>Disetujui</span>
                    ),
                    REJECTED: (
                        <span style={{ fontSize: 9, fontWeight: 700, textTransform: "uppercase", padding: "3px 8px", borderRadius: 4, background: "rgba(248,81,73,0.06)", color: "var(--red)", border: "1px solid rgba(248,81,73,0.18)", letterSpacing: "0.02em" }}>Ditolak</span>
                    )
                }[effectiveSt] || (
                    <span style={{ fontSize: 9, fontWeight: 700, textTransform: "uppercase", padding: "3px 8px", borderRadius: 4, background: "var(--surface-2)", color: "var(--text-3)", border: "1px solid var(--border)", letterSpacing: "0.02em" }}>{effectiveSt}</span>
                );

                return (
                    <div
                        onClick={handleBackdropClick}
                        style={{
                            position: "fixed", inset: 0, zIndex: 9999,
                            background: "rgba(0,0,0,0.55)",
                            display: "flex", alignItems: "center", justifyContent: "center",
                            padding: "20px",
                            backdropFilter: "blur(3px)",
                            animation: "fadeInOverlay 0.15s ease",
                        }}
                    >
                        <div style={{
                            background: "var(--surface)", border: "1px solid var(--border-2)",
                            borderRadius: 8, width: "100%", maxWidth: 600,
                            maxHeight: "85vh", display: "flex", flexDirection: "column",
                            boxShadow: "0 20px 50px rgba(0,0,0,0.4)",
                            animation: "slideUpModal 0.18s cubic-bezier(0.16, 1, 0.3, 1)",
                            overflow: "hidden",
                        }}>
                            {/* Modal header */}

                                padding: "14px 18px", borderBottom: "1px solid var(--border)",
                                display: "flex", alignItems: "center", gap: 10, flexShrink: 0,
                            }}>
                                <div style={{
                                    flexShrink: 0,
                                    background: isDraft ? "rgba(88,166,255,0.05)" : "rgba(63,185,80,0.05)",
                                    border: `1px solid ${isDraft ? "rgba(88,166,255,0.15)" : "rgba(63,185,80,0.15)"}`,
                                    color: isDraft ? "var(--blue)" : "var(--green)",
                                    borderRadius: 4, padding: "2px 6px", fontSize: 9, fontWeight: 700, textTransform: "uppercase",

                                            M {Number(item.magnitude).toFixed(1)}

                                                        const pColor = PRIORITY_COLORS[prio] || "var(--text-2)";

                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>

                                            <div>
                                                <div style={{ fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", color: "var(--text-2)", marginBottom: 2 }}>Estimasi Waktu</div>

                                            <span>Dibuat: {item.created_at ? new Date(item.created_at).toLocaleString("id-ID") : "—"}</span>
                                        </div>

                                            onClick={() => { isDraft ? onAct(item.id, "app") : onActPlan(item.id, "app"); onClose(); setTimeout(fetchAll, 500); }}

                                                onClick={() => { onEdit && onEdit(item.id); onClose(); }}

                                                onMouseEnter={e => e.currentTarget.style.background = "rgba(88,166,255,0.12)"}
                                                onMouseLeave={e => e.currentTarget.style.background = "rgba(88,166,255,0.06)"}
                                            >
                                                <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M8.5 1.5L10.5 3.5 4 10H2v-2L8.5 1.5Z" strokeLinecap="round" strokeLinejoin="round"/></svg>
