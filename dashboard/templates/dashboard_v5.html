                                ) : (
                                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                                        <span style={{ fontSize: 10, color: "var(--text-2)", display: "flex", alignItems: "center", gap: 4 }}>
                                            {effectiveSt === "APPROVED" ? (
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--green)" strokeWidth="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                            ) : (
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--red)" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                                            )}
                                            {effectiveSt === "APPROVED" ? "Approved" : "Rejected"}
                                            {item.approved_by ? ` oleh ${item.approved_by}` : ""}
                                        </span>
                                        <button 
                                            onClick={onClose} 
                                            style={{ padding: "6px 12px", border: "1px solid var(--border)", borderRadius: 5, cursor: "pointer", background: "none", color: "var(--text-2)", fontSize: 11 }}
                                            onMouseEnter={e => e.currentTarget.style.borderColor = "var(--border-2)"}
                                            onMouseLeave={e => e.currentTarget.style.borderColor = "var(--border)"}
                                        >
                                            Tutup
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            function PageAntrean({
                pendingDrafts,
                apprLocal,
                draftContents,
                onAct,
                onEdit,
                fetchData,
            }) {
                const [filter, setFilter] = useState("Semua");
                const [allDrafts, setAllDrafts] = useState([]);
                const [allPlans, setAllPlans] = useState([]);
                const [loading, setLoading] = useState(true);
                const [planLocal, setPlanLocal] = useState({});
                const [selectedItem, setSelectedItem] = useState(null);

                const fetchAll = async () => {
                    try {
                        const [dr, pl] = await Promise.all([
                            fetch("/api/approval/drafts").then(r => r.json()),
                            fetch("/api/approval/plans").then(r => r.json()),
                        ]);
                        if (dr.data) setAllDrafts(dr.data);
                        if (pl.data) setAllPlans(pl.data);
                    } catch(e) { console.error(e); }
                    setLoading(false);
                };

                useEffect(() => {
                    fetchAll();
                    const t = setInterval(fetchAll, 15000);
                    return () => clearInterval(t);
                }, []);

                const actPlan = async (id, action) => {
                    try {
                        await fetch(`/api/approval/plan/${id}/${action === "app" ? "approve" : "reject"}`, { method: "POST" });
                        setPlanLocal(p => ({ ...p, [id]: action }));
                        fetchAll();
                        fetchData && fetchData();
                    } catch(e) { console.error(e); }
                };

                const actDraft = async (id, action) => {
                    onAct(id, action);
                    setTimeout(() => {
                        fetchAll();
                        fetchData && fetchData();
                    }, 500);
                };

                // Combine items
                const draftsTagged = allDrafts.map(d => ({ ...d, _kind: "draft" }));
                const plansTagged  = allPlans.map(p  => ({ ...p, _kind: "plan"  }));
                const allItems = [...draftsTagged, ...plansTagged].sort(
                    (a, b) => new Date(b.created_at) - new Date(a.created_at)
                );

                const getEffectiveSt = (item) => {
                    const localSt = item._kind === "draft" ? apprLocal[item.id] : planLocal[item.id];
                    return localSt ? (localSt === "app" ? "APPROVED" : "REJECTED") : item.status;
                };

                const filtered = allItems.filter(item => {
                    const st = getEffectiveSt(item);
                    if (filter === "Semua")    return true;
                    if (filter === "Pending") return st === "DRAFT";
                    if (filter === "Approved") return st === "APPROVED";
                    if (filter === "Rejected")  return st === "REJECTED";
                    return true;
                });

                const DRAFT_LABELS = {
                    public_id: "Publik (ID)",
                    public_minang: "Publik (Minang)",
                    technical: "Teknis",
                    english: "English",
                };

                const grouped = filtered.reduce((acc, item) => {
                    const key = item.earthquake_id || "unknown";
                    if (!acc[key]) {
                        acc[key] = {
                            id: key,
                            items: [],
                            location: item.location_desc || "Lokasi tidak diketahui",
                            magnitude: Number(item.magnitude) || 0,
                            latest: item.created_at || item.updated_at || item.timestamp,
                        };
                    }
                    acc[key].items.push(item);
                    const mag = Number(item.magnitude) || 0;
                    acc[key].magnitude = Math.max(acc[key].magnitude, mag);
                    const ts = item.created_at || item.updated_at || item.timestamp;
                    if (ts && (!acc[key].latest || new Date(ts) > new Date(acc[key].latest))) {
                        acc[key].latest = ts;
                    }
                    return acc;
                }, {});

                const groupedList = Object.values(grouped).sort(
                    (a, b) => new Date(b.latest) - new Date(a.latest),
                );

                const pendingCount  = allItems.filter(i => getEffectiveSt(i) === "DRAFT").length;
                const approvedCount = allItems.filter(i => getEffectiveSt(i) === "APPROVED").length;
                const rejectedCount = allItems.filter(i => getEffectiveSt(i) === "REJECTED").length;
                const urgentCount   = allItems.filter(i => Number(i.magnitude) >= 6 && getEffectiveSt(i) === "DRAFT").length;
                
                const pendingDraftsCount = allItems.filter(i => getEffectiveSt(i) === "DRAFT" && i._kind === "draft").length;
                const pendingPlansCount  = allItems.filter(i => getEffectiveSt(i) === "DRAFT" && i._kind === "plan").length;

                const fmtTime = (ts) => {
                    if (!ts) return "—";
                    const d = new Date(ts);
                    return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short" }) + " · " +
                           d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
                };

                return (
                    <div style={{
                        display: "grid",
                        gridTemplateColumns: "180px 1fr",
                        gap: 20,
                        alignItems: "start",
                        maxWidth: 1000,
                        margin: "0 auto",
                    }} className="antrean-layout">

                        {/* ── LEFT SIDEBAR (Linear style) ─── */}
                        <div className="antrean-sidebar">
                            <div className="antrean-sidebar-card">
                                {/* Title area */}
                                <div className="antrean-header" style={{ flexDirection: "column", alignItems: "flex-start", gap: "8px" }}>
                                    <div className="antrean-title">APPROVAL QUEUE</div>
                                    <div style={{ display: "flex", gap: "6px", width: "100%" }}>
                                        <div className="antrean-count-chip" style={{ flex: 1, textAlign: "center", background: "var(--blue-sub)", color: "var(--blue)", border: "1px solid rgba(88,166,255,0.15)", padding: "4px 6px", borderRadius: "4px", fontSize: "10px", fontWeight: "600" }}>
                                            {loading ? "..." : `${pendingDraftsCount} Drafts`}
                                        </div>
                                        <div className="antrean-count-chip" style={{ flex: 1, textAlign: "center", background: "var(--green-sub)", color: "var(--green)", border: "1px solid rgba(63,185,80,0.15)", padding: "4px 6px", borderRadius: "4px", fontSize: "10px", fontWeight: "600" }}>
                                            {loading ? "..." : `${pendingPlansCount} Plans`}
                                        </div>
                                    </div>
                                </div>

                                {/* Navigation Filter List */}
                                <div className="antrean-filter-list">
                                    {[
                                        { key: "Semua", label: "Semua", count: allItems.length, icon: (color) => (
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
                                            <rect x="3" y="3" width="7" height="9" rx="1" />
                                            <rect x="14" y="3" width="7" height="5" rx="1" />
                                            <rect x="14" y="12" width="7" height="9" rx="1" />
                                            <rect x="3" y="16" width="7" height="5" rx="1" />
                                        </svg>
                                    )},
                                    { key: "Pending", label: "Pending", count: pendingCount, icon: (color) => (
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
                                            <circle cx="12" cy="12" r="10" />
                                            <polyline points="12 6 12 12 16 14" />
                                        </svg>
                                    )},
                                    { key: "Approved", label: "Approved", count: approvedCount, icon: (color) => (
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
                                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                                            <polyline points="22 4 12 14.01 9 11.01" />
                                        </svg>
                                    )},
                                    { key: "Rejected", label: "Rejected", count: rejectedCount, icon: (color) => (
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2">
                                            <circle cx="12" cy="12" r="10" />
                                            <line x1="15" y1="9" x2="9" y2="15" />
                                            <line x1="9" y1="9" x2="15" y2="15" />
                                        </svg>
                                    )},
                                ].map(s => {
                                    const isActive = filter === s.key;
                                    const iconColor = isActive 
                                        ? (s.key === "Pending" ? "var(--orange)" : s.key === "Approved" ? "var(--green)" : s.key === "Rejected" ? "var(--red)" : "var(--text-1)") 
                                        : "var(--text-2)";
                                    return (
                                        <div
                                            key={s.key}
                                            onClick={() => setFilter(s.key)}
                                            className={`antrean-filter-item${isActive ? " active" : ""}`}
                                        >
                                            <span style={{ display: "flex", alignItems: "center", flexShrink: 0 }}>
                                                {s.icon(iconColor)}
                                            </span>
                                            <span className={`antrean-filter-label${isActive ? "" : " muted"}`}>
                                                {s.label}
                                            </span>
                                            <span className={`antrean-filter-count${isActive ? "" : " muted"}`}>
                                                {s.count}
                                            </span>
                                        </div>
                                    );
                                })}
                                </div>

                                {/* Urgent static alert */}
                                {urgentCount > 0 && (
                                    <div className="antrean-urgent">
                                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--red)" strokeWidth="2.5" style={{ marginTop: 2, flexShrink: 0 }}>
                                            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                                        </svg>
                                        <span className="antrean-urgent-text">
                                            {urgentCount} item mendesak (M>=6) ditandai label URGENT.
                                        </span>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* ── RIGHT: MAIN CONTENT ── */}
                        <div style={{ minWidth: 0 }}>
                            {/* Top Bar Location Breadcrumb */}
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10, height: 20 }}>
                                <div style={{ fontSize: 11, fontWeight: 500, color: "var(--text-2)", display: "flex", alignItems: "center", gap: 4 }}>
                                    <span style={{ color: "var(--text-3)" }}>Queue</span>
                                    <span style={{ color: "var(--text-3)" }}>/</span>
                                    <span>{filter}</span>
                                    <span style={{
                                        fontSize: 9, 
                                        fontFamily: "var(--mono)", 
                                        color: "var(--text-2)", 
                                        background: "var(--surface-2)",
                                        border: "1px solid var(--border)",
                                        padding: "0 4px",
                                        borderRadius: 3,
                                        marginLeft: 4,
                                    }}>{filtered.length}</span>
                                </div>
                            </div>

                            {/* Items */}
                            {loading ? (
                                <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--r)", padding: "40px 0", textAlign: "center", color: "var(--text-3)", fontSize: 11 }}>
                                    Loading data...
                                </div>
                            ) : filtered.length === 0 ? (
                                <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--r)", padding: "48px 0", textAlign: "center", color: "var(--text-3)" }}>
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" style={{ display: "block", margin: "0 auto 8px", opacity: 0.3 }}>
                                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                                        <polyline points="14 2 14 8 20 8"/>
                                        <line x1="9" y1="13" x2="15" y2="13"/>
                                        <line x1="9" y1="17" x2="13" y2="17"/>
                                    </svg>
                                    <div style={{ fontSize: 11, fontWeight: 500 }}>No items</div>
                                    <div style={{ fontSize: 10, marginTop: 2, opacity: 0.7 }}>untuk filter "{filter}"</div>
                                </div>
                            ) : (
                                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                                    {groupedList.map((group) => {
                                        const draftsCount = group.items.filter(
                                            (i) => i._kind === "draft",
                                        ).length;
                                        const plansCount = group.items.filter(
                                            (i) => i._kind === "plan",
                                        ).length;
                                        const pendingInGroup = group.items.filter(
                                            (i) => getEffectiveSt(i) === "DRAFT",
                                        ).length;
                                        const urgentInGroup = group.items.filter(
                                            (i) =>
                                                Number(i.magnitude) >= 6 &&
                                                getEffectiveSt(i) === "DRAFT",
                                        ).length;
                                        return (
                                            <details
                                                key={group.id}
                                                className="antrean-group"
                                                defaultOpen={pendingInGroup > 0}
                                            >
                                                <summary className="antrean-group-summary">
                                                    <div className="ag-left">
                                                        <span className="ag-mag">
                                                            M{group.magnitude.toFixed(1)}
                                                        </span>
                                                        <div className="ag-meta">
                                                            <div className="ag-title">
                                                                {group.location}
                                                            </div>
                                                            <div className="ag-sub">
                                                                {fmtTime(group.latest)} · {draftsCount} drafts · {plansCount} plans
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="ag-badges">
                                                        {urgentInGroup > 0 && (
                                                            <span className="ag-chip urgent">
                                                                URGENT {urgentInGroup}
                                                            </span>
                                                        )}
                                                        <span className="ag-chip pending">
                                                            {pendingInGroup} pending
                                                        </span>
                                                        <span className="ag-chip type">
                                                            {draftsCount + plansCount} item
                                                        </span>
                                                    </div>
                                                </summary>
                                                <div className="antrean-group-items">
                                                    {group.items.map((item) => {
                                                        const isDraft = item._kind === "draft";
                                                        const effectiveSt = getEffectiveSt(item);
                                                        const isUrgent =
                                                            Number(item.magnitude) >= 6 &&
                                                            effectiveSt === "DRAFT";

                                                        const preview = isDraft
                                                            ? (draftContents[item.id] || item.content || "").substring(0, 160)
                                                            : (item.resource_mapping || "").substring(0, 160);

                                                        const statusIcon = {
                                                            DRAFT: (
                                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" strokeWidth="2.5" style={{ flexShrink: 0 }}>
                                                                    <circle cx="12" cy="12" r="10" />
                                                                    <polyline points="12 6 12 12 16 14" />
                                                                </svg>
                                                            ),
                                                            APPROVED: (
                                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--green)" strokeWidth="2.5" style={{ flexShrink: 0 }}>
                                                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                                                                    <polyline points="22 4 12 14.01 9 11.01" />
                                                                </svg>
                                                            ),
                                                            REJECTED: (
                                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--red)" strokeWidth="2.5" style={{ flexShrink: 0 }}>
                                                                    <circle cx="12" cy="12" r="10" />
                                                                    <line x1="15" y1="9" x2="9" y2="15" />
                                                                    <line x1="9" y1="9" x2="15" y2="15" />
                                                                </svg>
                                                            )
                                                        }[effectiveSt] || (
                                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" strokeWidth="2.5" style={{ flexShrink: 0 }}>
                                                                <circle cx="12" cy="12" r="10" />
                                                            </svg>
                                                        );

                                                        const typeLabel = isDraft
                                                            ? (DRAFT_LABELS[item.draft_type] || "Communication Draft")
                                                            : "Coordination Plan";

                                                        return (
                                                            <div
                                                                key={`${item._kind}-${item.id}`}
                                                                onClick={() => setSelectedItem(item)}
                                                                style={{
                                                                    background: "var(--surface)",
                                                                    border: "1px solid var(--border)",
                                                                    borderRadius: "var(--r)",
                                                                    padding: "10px 12px",
                                                                    cursor: "pointer",
                                                                    transition: "all 0.12s ease",
                                                                    display: "flex",
                                                                    flexDirection: "column",
                                                                    gap: 5,
                                                                }}
                                                                onMouseEnter={e => {
                                                                    e.currentTarget.style.borderColor = "var(--border-2)";
                                                                    e.currentTarget.style.background = "var(--surface-2)";
                                                                }}
                                                                onMouseLeave={e => {
                                                                    e.currentTarget.style.borderColor = "var(--border)";
                                                                    e.currentTarget.style.background = "var(--surface)";
                                                                }}
                                                            >
                                                                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                                                                    <div style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 0 }}>
                                                                        {statusIcon}
                                                                        <span style={{
                                                                            fontSize: 11,
                                                                            fontWeight: 600,
                                                                            color: "var(--text-1)",
                                                                            textTransform: "capitalize",
                                                                            overflow: "hidden",
                                                                            textOverflow: "ellipsis",
                                                                            whiteSpace: "nowrap"
                                                                        }}>
                                                                            {typeLabel}
                                                                        </span>
                                                                        <span style={{
                                                                            fontFamily: "var(--mono)",
                                                                            fontSize: 9,
                                                                            color: "var(--text-3)",
                                                                            background: "rgba(255,255,255,0.02)",
                                                                            border: "1px solid var(--border)",
                                                                            padding: "1px 4px",
                                                                            borderRadius: 3,
                                                                        }}>
                                                                            #{item.id}
                                                                        </span>
                                                                        <span style={{
                                                                            fontSize: 8,
                                                                            fontWeight: 600,
                                                                            textTransform: "uppercase",
                                                                            padding: "1px 4px",
                                                                            borderRadius: 3,
                                                                            background: isDraft ? "rgba(88,166,255,0.04)" : "rgba(63,185,80,0.04)",
                                                                            color: isDraft ? "var(--blue)" : "var(--green)",
                                                                            border: `1px solid ${isDraft ? "rgba(88,166,255,0.12)" : "rgba(63,185,80,0.12)"}`,
                                                                            letterSpacing: "0.03em",
                                                                        }}>
                                                                            {isDraft ? "Draft" : "Plan"}
                                                                        </span>
                                                                    </div>

                                                                    <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                                                                        <span style={{
                                                                            fontFamily: "var(--mono)",
                                                                            fontSize: 9,
                                                                            fontWeight: 700,
                                                                            color: isUrgent ? "var(--red)" : "var(--text-2)",
                                                                            background: isUrgent ? "rgba(248,81,73,0.05)" : "var(--surface-2)",
                                                                            border: `1px solid ${isUrgent ? "rgba(248,81,73,0.18)" : "var(--border)"}`,
                                                                            padding: "1px 5px",
                                                                            borderRadius: 3,
                                                                        }}>
                                                                            M {Number(item.magnitude).toFixed(1)}
                                                                        </span>
                                                                        {isUrgent && (
                                                                            <span className="antrean-urgent-tag">
                                                                                URGENT
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                </div>

                                                                {preview && (
                                                                    <div style={{
                                                                        fontSize: 10.5,
                                                                        color: "var(--text-2)",
                                                                        lineHeight: 1.45,
                                                                        overflow: "hidden",
                                                                        display: "-webkit-box",
                                                                        WebkitLineClamp: 2,
                                                                        WebkitBoxOrient: "vertical",
                                                                    }}>
                                                                        {preview}
                                                                    </div>
                                                                )}

                                                                <div style={{
                                                                    display: "flex",
                                                                    alignItems: "center",
                                                                    justifyContent: "space-between",
                                                                    fontSize: 9,
                                                                    color: "var(--text-3)",
                                                                    marginTop: 1,
                                                                    borderTop: "1px solid rgba(255,255,255,0.02)",
                                                                    paddingTop: 3,
                                                                }}>
                                                                    <span style={{
                                                                        overflow: "hidden",
                                                                        textOverflow: "ellipsis",
                                                                        whiteSpace: "nowrap",
                                                                        color: "var(--text-2)",
                                                                    }}>
                                                                        {item.location_desc || "—"}
                                                                    </span>
                                                                    <span style={{ fontFamily: "var(--mono)", flexShrink: 0, marginLeft: 12 }}>
                                                                        {fmtTime(item.created_at)}
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </details>
                                        );
                                    })}
                                </div>
                            )}
                        </div>

                        {/* Modal popup */}
                        {selectedItem && (
                            <AntreanModal
                                item={selectedItem}
                                apprLocal={apprLocal}
                                planLocal={planLocal}
                                draftContents={draftContents}
                                onAct={actDraft}
                                onEdit={onEdit}
                                onActPlan={actPlan}
                                fetchAll={fetchAll}
                                onClose={() => setSelectedItem(null)}
                            />
                        )}
                    </div>
                );
            }

            function PageLaporan() {
                const [majorEqs, setMajorEqs] = useState([]);
                const [selectedEq, setSelectedEq] = useState(null);
                const [laporan, setLaporan] = useState(null);
                const [activeTab, setActiveTab] = useState("sitrep");
                const [loading, setLoading] = useState(false);
                const [laporanToast, setLaporanToast] = useState(null);
                const [pdfDownloading, setPdfDownloading] = useState(false);
                const showLaporanToast = (msg) => {
                    setLaporanToast(msg);
                    setTimeout(() => setLaporanToast(null), 2000);
                };
                useEffect(() => {
                    fetch("/api/earthquakes/major")
                        .then((r) => r.json())
                        .then((j) => {
                            if (j.data) setMajorEqs(j.data);
                        })
                        .catch(console.error);
                }, []);
                const selectEq = async (eq) => {
                    setSelectedEq(eq);
                    setLaporan(null);
                    setLoading(true);
                    setActiveTab("sitrep");
                    try {
                        const res = await fetch(`/api/laporan/${eq.id}`);
                        if (res.ok) {
                            const j = await res.json();
                            setLaporan(j.data);
                        }
                    } catch (e) {
                        console.error(e);
                    }
                    setLoading(false);
                };
                const copyText = (text) => {
                    navigator.clipboard
                        .writeText(text)
                        .then(() => showLaporanToast("Disalin ke clipboard!"))
                        .catch(() => showLaporanToast("Failed to copy"));
                };
                const downloadPdf = async (eqId) => {
                    if (pdfDownloading) return;
                    setPdfDownloading(true);
                    showLaporanToast("Menyiapkan unduhan PDF...");
                    try {

                                const j = await res.json();
                                setAuditLogs(j.data || []);

                        } catch (e) {
                            console.error(e);
                        }
                        if (alive) setLoading(false);

                        const table = (log.item_table || "").toLowerCase();
